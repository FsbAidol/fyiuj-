name: build-windows

permissions:
  contents: write

on:
  push:
    branches: [ main, arena/dfd52b60-fyiuj ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AmazingBot.sln

      - name: Build
        run: dotnet build AmazingBot.sln -c Release --no-restore

      - name: Publish GUI (single file, self-contained)
        run: dotnet publish src/AmazingBot.App/AmazingBot.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/gui

      - name: Publish CLI (single file, self-contained)
        run: dotnet publish src/AmazingBot/AmazingBot.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmazingBot-win-x64
          path: |
            out/gui/AmazingBot.App.exe
            out/cli/AmazingBot.exe

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Copy-Item -LiteralPath "ИНСТРУКЦИЯ.md" -Destination "INSTRUCTION.md"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "out/gui/AmazingBot.App.exe#AmazingBot.App.exe"
          "out/cli/AmazingBot.exe#AmazingBot.exe"
          "configs/config.example.json#config.example.json"
          "INSTRUCTION.md#INSTRUCTION.md"
          --title "AmazingBot ${{ github.ref_name }}"
          --notes "Готовые сборки AmazingBot для Windows (self-contained, .NET не нужен).

          Что внутри:
          - повторяемые записанные циклы шахты, рыбалки удочкой и рыбалки сетью;
          - запись маршрутов с F10, повтор цикла и аварийная остановка по F12;
          - анти-афк.

          Настройте config.json, выберите профессию, запишите соответствующий цикл во вкладке «Маршруты» и запускайте. Маршрут должен завершаться у исходной точки для аккуратного повторения.

          В сборке есть экранная подсветка руды по BMP-шаблону; обнаружение сквозь стены и распознавание результата игровых действий не реализованы."
