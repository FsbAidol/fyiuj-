name: build-windows-exe

# Builds AmazingBot.exe on a real Windows runner (PyInstaller cannot cross-compile
# from Linux) and publishes it as a downloadable artifact + Release asset.
#
#   * push to main / any arena branch -> artifact "AmazingBot-windows" (30 days)
#   * push a tag like v1.0.0           -> Release with AmazingBot-v1.0.0-win64.zip
#   * manual run from the Actions tab  -> artifact

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    name: exe (windows)
    needs: test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller tools/amazingbot.spec --noconfirm

      - name: Copy user-editable files next to the exe
        shell: pwsh
        run: |
          $dist = "dist/AmazingBot"
          # config, scripts, demo_templates and templates are already bundled by
          # the spec; make sure a config.yaml sits next to the exe as well so the
          # user can edit it without opening the _internal folder
          Copy-Item config.yaml "$dist/config.yaml" -Force
          if (Test-Path templates) { Copy-Item templates "$dist/templates" -Recurse -Force }
          Copy-Item demo_templates "$dist/demo_templates" -Recurse -Force
          Copy-Item scripts "$dist/scripts" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$dist/logs", "$dist/state" | Out-Null
          @"
          Amazing Online bot
          ==================
          1. Запустите AmazingBot.exe (двойной клик) - откроется меню.
          2. Для реальной игры: положите свои шаблоны в папку templates\
             и укажите её в config.yaml (vision.templates_dir: templates).
          3. Для проверки без игры: меню -> "Прогон на симуляторе".
          Подробности: docs\КАК_ЗАПУСТИТЬ.md
          "@ | Set-Content -Encoding UTF8 "$dist/ЧИТАЙ_МЕНЯ.txt"
          Copy-Item docs "$dist/docs" -Recurse -Force

      - name: Smoke test (exe starts, imports everything, menu renders)
        shell: pwsh
        run: |
          $exe = "dist/AmazingBot/AmazingBot.exe"

          # 1) CLI works and the bundle is intact
          $version = & $exe --version 2>&1 | Out-String
          Write-Host $version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          if ($version -notmatch "amazing-bot") { throw "unexpected version output" }

          # 2) the real imports (cv2, yaml, mss, pyautogui, pynput) load in the
          #    frozen build: `check` touches config, templates, scripts, OCR,
          #    hotkeys and the device layer. It may exit 1 (no adb in CI) - that
          #    is fine, a crash/traceback is not.
          $check = & $exe check 2>&1 | Out-String
          Write-Host $check
          if ($check -match "Traceback|ModuleNotFoundError|ImportError") {
            throw "frozen build is missing modules"
          }
          if ($check -notmatch "RESULT:") { throw "check did not run" }

          # 3) menu renders when double-clicked (no args); feed it "0" to quit
          $menu = "0" | & $exe 2>&1 | Out-String
          Write-Host $menu
          if ($menu -notmatch "Amazing Online bot") { throw "launcher menu did not render" }
          exit 0

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AmazingBot/* -DestinationPath AmazingBot-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmazingBot-windows
          path: AmazingBot-win64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          Сборка бота для Amazing Online ($tag).

          Скачайте **AmazingBot-win64.zip**, распакуйте и запустите AmazingBot.exe.
          Внутри: config.yaml, templates, scripts, demo_templates, логи и инструкция.
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag AmazingBot-win64.zip --clobber
          } else {
            gh release create $tag AmazingBot-win64.zip --title "AmazingBot $tag" --notes "$notes"
          }

  build-desktop:
    name: linux bundle (desktop backend)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps + system libs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Build
        run: pyinstaller tools/amazingbot.spec --noconfirm
      - name: Smoke test
        run: ./dist/AmazingBot/AmazingBot --version
      - name: Zip
        run: |
          cp config.yaml dist/AmazingBot/
          cp -r scripts demo_templates dist/AmazingBot/
          (cd dist && zip -qr AmazingBot-linux.tar.zip AmazingBot)
          tar -czf AmazingBot-linux.tar.gz -C dist AmazingBot
      - uses: actions/upload-artifact@v4
        with:
          name: AmazingBot-linux
          path: |
            AmazingBot-linux.tar.gz
            AmazingBot-linux.tar.zip
          retention-days: 30
