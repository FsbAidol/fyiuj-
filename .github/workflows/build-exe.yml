name: build-windows-exe

# Builds AmazingBot.exe on a real Windows runner (PyInstaller cannot cross-compile
# from Linux) and publishes it as a downloadable artifact + Release asset.
#
#   * push to main / any arena branch -> artifact "AmazingBot-windows" (30 days)
#   * push a tag like v1.0.0           -> Release with AmazingBot-v1.0.0-win64.zip
#   * manual run from the Actions tab  -> artifact

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    name: exe (windows)
    needs: test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller tools/amazingbot.spec --noconfirm

      - name: Copy user-editable files next to the exe
        shell: pwsh
        run: |
          $dist = "dist/AmazingBot"
          # config, scripts, demo_templates and templates are already bundled by
          # the spec; make sure a config.yaml sits next to the exe as well so the
          # user can edit it without opening the _internal folder
          Copy-Item config.yaml "$dist/config.yaml" -Force
          if (Test-Path templates) { Copy-Item templates "$dist/templates" -Recurse -Force }
          Copy-Item demo_templates "$dist/demo_templates" -Recurse -Force
          Copy-Item scripts "$dist/scripts" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$dist/logs", "$dist/state" | Out-Null
          @"
          Amazing Online bot
          ==================
          1. Запустите AmazingBot.exe (двойной клик) - откроется меню.
          2. Для реальной игры: положите свои шаблоны в папку templates\
             и укажите её в config.yaml (vision.templates_dir: templates).
          3. Для проверки без игры: меню -> "Прогон на симуляторе".
          4. Логи лежат в папке logs\ рядом с exe (меню -> пункт 5).
             Если бот упал: logs\bot.log и logs\crash-*.txt.
          Подробности: docs\КАК_ЗАПУСТИТЬ.md
          "@ | Set-Content -Encoding UTF8 "$dist/ЧИТАЙ_МЕНЯ.txt"
          Copy-Item docs "$dist/docs" -Recurse -Force

      - name: Smoke test one-file exe
        shell: pwsh
        run: |
          $exe = "dist/AmazingBot-onefile.exe"
          $version = & $exe --version 2>&1 | Out-String
          Write-Host $version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "amazing-bot") { throw "onefile exe broken" }

      - name: Smoke test (exe starts, imports everything, menu renders)
        shell: pwsh
        run: |
          $exe = "dist/AmazingBot/AmazingBot.exe"

          # 1) CLI works and the bundle is intact
          $version = & $exe --version 2>&1 | Out-String
          Write-Host $version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          if ($version -notmatch "amazing-bot") { throw "unexpected version output" }

          # 2) the real imports (cv2, yaml, mss, pyautogui, pynput) load in the
          #    frozen build: `check` touches config, templates, scripts, OCR,
          #    hotkeys and the device layer. It may exit 1 (no adb in CI) - that
          #    is fine, a crash/traceback is not.
          $check = & $exe check 2>&1 | Out-String
          Write-Host $check
          if ($check -match "Traceback|ModuleNotFoundError|ImportError") {
            throw "frozen build is missing modules"
          }
          if ($check -notmatch "RESULT:") { throw "check did not run" }

          # 2b) the log file must actually receive something (users report an
          #     empty bot.log as a bug - it must never be 0 bytes)
          $log = "dist/AmazingBot/logs/bot.log"
          if (-not (Test-Path $log)) { throw "bot.log was not created" }
          $logText = Get-Content $log -Raw -Encoding UTF8
          Write-Host $logText
          if ($logText -notmatch "AmazingBot" -or $logText -notmatch "command=check") {
            throw "bot.log is empty or missing the startup banner"
          }

          # 3) menu renders when double-clicked (no args); feed it "0" to quit
          $menu = "0" | & $exe 2>&1 | Out-String
          Write-Host $menu
          if ($menu -notmatch "Amazing Online bot") { throw "launcher menu did not render" }
          exit 0

      - name: Zip
        shell: pwsh
        run: |
          # the one-file exe needs nothing but a config beside it
          New-Item -ItemType Directory -Force -Path dist/onefile | Out-Null
          Copy-Item dist/AmazingBot-onefile.exe dist/onefile/AmazingBot.exe -Force
          Copy-Item config.yaml dist/onefile/
          Compress-Archive -Path dist/AmazingBot/* -DestinationPath AmazingBot-win64.zip
          Compress-Archive -Path dist/onefile/* -DestinationPath AmazingBot-onefile-win64.zip

      - name: Verify archive contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $required = @{
            "AmazingBot-win64.zip"          = @("AmazingBot.exe", "config.yaml", "scripts/eat.yaml",
                                                "demo_templates/cast_button.png", "ЧИТАЙ_МЕНЯ.txt")
            "AmazingBot-onefile-win64.zip"  = @("AmazingBot.exe", "config.yaml")
          }
          $bad = @()
          foreach ($zip in $required.Keys) {
            $names = ([System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))).Entries |
                       ForEach-Object { $_.FullName -replace '\\', '/' }
            Write-Host "== $zip =="
            $names | Sort-Object | Select-Object -First 12 | ForEach-Object { Write-Host "   $_" }
            Write-Host "   ... ($($names.Count) entries)"
            foreach ($need in $required[$zip]) {
              if (-not ($names | Where-Object { $_ -eq $need -or $_.EndsWith("/$need") })) {
                $bad += "$zip -> missing $need"
              }
            }
          }
          if ($bad) { throw ($bad -join "; ") }
          Write-Host "archives look complete"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmazingBot-windows
          path: |
            AmazingBot-win64.zip
            AmazingBot-onefile-win64.zip
          retention-days: 30
          if-no-files-found: error

      # a permanent "latest" release: the Actions artifact needs a GitHub login,
      # the Release download does not - this is the link to hand to users
      - name: Update latest release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "latest"
          $assets = @("AmazingBot-win64.zip", "AmazingBot-onefile-win64.zip")
          $notes = @"
          Готовый бот для Amazing Online (автосборка из ветки ``${{ github.ref_name }}``, коммит ${{ github.sha }}).

          **Как запустить**
          1. Скачайте ``AmazingBot-onefile-win64.zip`` (проще) или ``AmazingBot-win64.zip`` (быстрее стартует).
          2. Распакуйте в любую папку и запустите ``AmazingBot.exe`` - откроется меню.
          3. Сначала «Прогон на симуляторе» (проверка без игры), потом «Запустить бота».
          4. Для реальной игры положите свои шаблоны в ``templates\`` и укажите её в ``config.yaml``.

          Подробности - ``docs\КАК_ЗАПУСТИТЬ.md`` внутри архива.
          "@

          # upload into the existing release; create it only when it is missing
          gh release upload $tag @assets --clobber 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets --title "AmazingBot (последняя сборка)" --notes "$notes" --latest
            if ($LASTEXITCODE -ne 0) { throw "could not create release" }
          } else {
            gh release edit $tag --title "AmazingBot (последняя сборка)" --notes "$notes"
          }
          gh release view $tag --json assets -q '.assets[].name'

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @("AmazingBot-win64.zip", "AmazingBot-onefile-win64.zip")
          $notes = @"
          Сборка бота для Amazing Online ($tag).

          Скачайте **AmazingBot-onefile-win64.zip** (один exe) или
          **AmazingBot-win64.zip** (папка, стартует быстрее).
          Внутри: config.yaml, templates, scripts, demo_templates, логи и инструкция.
          "@
          gh release upload $tag @assets --clobber 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets --title "AmazingBot $tag" --notes "$notes"
            if ($LASTEXITCODE -ne 0) { throw "could not create release" }
          }
